[package]
name = "gideon-sources"
description = "Aidoku/bobo-compatible manga source list management for gideon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gideon-core = { path = "../gideon-core" }
# The Internet Archive client lives in its own repo (split out of this
# workspace in PR #186); pinned to a commit so builds are reproducible.
archivist = { git = "https://github.com/evanspn/Grand-Archives", rev = "9554d3e034591784350b3d88e4e77e9ca9d89be3" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
url.workspace = true
ureq.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
filetime = "0.2"
