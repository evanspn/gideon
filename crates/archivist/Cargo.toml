[package]
name = "archivist"
description = "Search and download public-domain books from the Internet Archive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Standalone on purpose: no gideon crate is a dependency, so this lifts out
# into its own repository unchanged.

[lib]
path = "src/lib.rs"

[[bin]]
name = "archivist"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
ureq.workspace = true
clap.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"

[dev-dependencies]
tempfile.workspace = true
