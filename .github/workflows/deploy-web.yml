name: Deploy web dashboard

# Auto-publishes the reading-stats dashboard to Vercel production on every
# push to main that touches it, so merging a web change ships it — no manual
# `vercel deploy`. Auth is a single repo secret, VERCEL_TOKEN; the org/project
# IDs below are not sensitive (they're public identifiers).
#
# Deploys from the REPO ROOT, exactly like the Vercel Git integration does, so
# both paths ship the same thing: `vercel.json` serves the static dashboard out
# of web/, and the serverless functions come from the root api/ directory.
# Deploying from web/ instead (as this used to) leaves api/ behind, which is
# how production ended up answering 404 for every MyAnimeList call.
#
# One-time setup: add a repo secret named VERCEL_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   (create the token at https://vercel.com/account/tokens)
#
# A missing OR expired token skips the CLI deploy with a loud warning rather
# than failing the merge build — rotating it is the repo owner's job, and a
# dead credential is not a reason to paint main red. What is NOT skipped is
# the verification below: the Vercel Git integration deploys main on push
# too, so the live site still has to match what was merged. If it doesn't,
# this job fails, which is the signal that actually matters.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "vercel.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_SCwtDjn6cIEwuPLDC4gQBptq
      VERCEL_PROJECT_ID: prj_Rwpku6dDxEC75ApmdsiAkjP1K7j1
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy token
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel deploy skipped::Set the VERCEL_TOKEN repo secret to enable auto-deploy (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          # A token that exists but has expired used to fail the deploy step
          # and, with it, every merge to main. Ask first, and treat a dead
          # token exactly like a missing one.
          if npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel token rejected::VERCEL_TOKEN is set but Vercel rejected it (expired or revoked). Rotate it at https://vercel.com/account/tokens and update the repo secret. Falling back to the Git integration's own deploy; the live-site check below still runs."
          fi

      - name: Deploy (production)
        if: steps.guard.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### 🚀 Deployed web dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live site
        run: |
          # The static files must match what was merged, byte for byte —
          # whether this job deployed them or the Git integration did. The
          # retry window is generous because an integration deploy starts on
          # its own schedule, not ours.
          for f in app.js styles.css index.html; do
            ok=false
            for attempt in $(seq 1 20); do
              code=$(curl -s -o "/tmp/live_$f" -w "%{http_code}" "https://gideon-sync.vercel.app/$f")
              if [ "$code" = "200" ] && cmp -s "/tmp/live_$f" "web/$f"; then
                ok=true; break
              fi
              sleep 15
            done
            if [ "$ok" != "true" ]; then
              echo "::error::$f on the live site did not match web/$f (last HTTP $code)"; exit 1
            fi
            echo "$f ✓ (matches, HTTP 200)"
          done

          # The API functions must EXIST. This check only ever looked at the
          # static files, so a deploy that shipped no functions passed happily
          # while every MyAnimeList feature answered 404 in the browser.
          # 404 is the failure; anything else (200, or 503 "proxy-unconfigured"
          # when the MAL env vars are absent) means the function is live.
          for ep in "api/mal-oauth?action=config" "api/mal?path=manga%2Franking"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://gideon-sync.vercel.app/$ep")
            if [ "$code" = "404" ]; then
              echo "::error::/$ep is not deployed (HTTP 404) — the serverless functions in api/ did not ship"; exit 1
            fi
            echo "/$ep ✓ (function is live, HTTP $code)"
          done
