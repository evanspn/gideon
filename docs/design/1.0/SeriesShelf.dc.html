<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "DejaVu Sans", Verdana, Geneva, sans-serif; }
    a { color: #8a4a2a; } a:hover { color: #5e3018; }
  </style>
</helmet>

<div style="width: 1264px; height: 1680px; background: #ffffff; color: #000000; display: flex; flex-direction: column; overflow: hidden;">

  <!-- title bar -->
  <div style="height: 102px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 19px; border-bottom: 1px solid #555555; box-sizing: border-box;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"></path></svg>
    <div style="font-size: 38px; font-weight: 700;">Vinland Saga</div>
    <div style="flex-grow: 1;"></div>
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4" fill="#000000"></circle><circle cx="12" cy="12" r="1.4" fill="#000000"></circle><circle cx="12" cy="19" r="1.4" fill="#000000"></circle></svg>
  </div>

  <!-- hero: cover + facts -->
  <div style="padding: 24px 19px; display: flex; gap: 24px; flex-shrink: 0;">
    <div style="width: 300px; height: 450px; flex-shrink: 0; background: #6f7d86; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box;">
      <div style="color: #ffffff; font-size: 30px; font-weight: 700; line-height: 1.15; text-wrap: pretty;">Vinland Saga</div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <div style="font-size: 30px; color: #333333;">Makoto Yukimura &middot; 2005</div>
      <div style="height: 14px;"></div>

      <!-- the MAL block: score, rank, status, genres — all thrown away by mal.rs today -->
      <div style="display: flex; align-items: stretch; border: 1px solid #aaaaaa;">
        <div style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #dddddd;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="{{accent}}" stroke="none"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8Z"></path></svg>
            <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">8.74</div>
          </div>
          <div style="font-size: 22px; letter-spacing: 1.6px; text-transform: uppercase; color: #555555;">Score</div>
        </div>
        <div style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #dddddd;">
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">#12</div>
          <div style="font-size: 22px; letter-spacing: 1.6px; text-transform: uppercase; color: #555555;">Ranked</div>
        </div>
        <div style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 38px; font-weight: 700;">Publishing</div>
          <div style="font-size: 22px; letter-spacing: 1.6px; text-transform: uppercase; color: #555555;">Status</div>
        </div>
      </div>

      <div style="height: 16px;"></div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <div style="border: 1px solid #aaaaaa; padding: 5px 14px; font-size: 25px; color: #333333;">Action</div>
        <div style="border: 1px solid #aaaaaa; padding: 5px 14px; font-size: 25px; color: #333333;">Adventure</div>
        <div style="border: 1px solid #aaaaaa; padding: 5px 14px; font-size: 25px; color: #333333;">Drama</div>
        <div style="border: 1px solid #aaaaaa; padding: 5px 14px; font-size: 25px; color: #333333;">Historical</div>
      </div>

      <div style="flex-grow: 1;"></div>

      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums;">54 / 213</div>
        <div style="font-size: 28px; color: #555555;">read &middot; 18 downloaded</div>
      </div>
      <div style="height: 10px;"></div>
      <div style="height: 8px; background: #cccccc;">
        <div style="height: 8px; background: #222222; width: 25%;"></div>
      </div>
      <div style="height: 20px;"></div>
      <div style="height: 102px; border: 2px solid #000000; display: flex; align-items: center; justify-content: center; gap: 14px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h5a3 3 0 0 1 3 3v10a2.5 2.5 0 0 0-2.5-2.5H4Z"></path><path d="M20 5.5h-5a3 3 0 0 0-3 3v10a2.5 2.5 0 0 1 2.5-2.5H20Z"></path></svg>
        <div style="font-size: 36px; font-weight: 700;">Resume chapter 54</div>
      </div>
    </div>
  </div>

  <div style="height: 1px; background: #555555;"></div>

  <!-- chapter list, 102px rows with the existing icon gutter -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
    <sc-for list="{{chapters}}" as="ch" hint-placeholder-count="6">
      <div style="height: 102px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 19px; border-bottom: 1px solid #dddddd; box-sizing: border-box; background: {{ch.bg}};">
        <div style="width: 40px; flex-shrink: 0; display: flex; justify-content: center;">
          <sc-if value="{{ch.read}}" hint-placeholder-val="{{true}}">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5 11-11"></path></svg>
          </sc-if>
        </div>
        <div style="width: 40px; flex-shrink: 0; display: flex; justify-content: center;">
          <sc-if value="{{ch.downloaded}}" hint-placeholder-val="{{true}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"></path><path d="m7.5 10 4.5 4.5 4.5-4.5"></path><path d="M4 20h16"></path></svg>
          </sc-if>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 34px; font-weight: {{ch.weight}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ch.title}}</div>
          <div style="font-size: 24px; color: #555555;">{{ch.sub}}</div>
        </div>
        <div style="font-size: 26px; color: #555555; font-variant-numeric: tabular-nums; flex-shrink: 0;">{{ch.right}}</div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="5" r="1.4" fill="#555555"></circle><circle cx="12" cy="12" r="1.4" fill="#555555"></circle><circle cx="12" cy="19" r="1.4" fill="#555555"></circle></svg>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#b4633a","section":"Theme"},"$preview":{"width":1264,"height":1680}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#b4633a',
      chapters: [
        { title: 'Ch. 54 — The Battle of the Gods', sub: 'page 12 of 44 · 2 days ago', right: '27%', read: false, downloaded: true, weight: '700', bg: '#f4f4f4' },
        { title: 'Ch. 55 — Prologue', sub: '44 pages', right: '', read: false, downloaded: true, weight: '400', bg: '#ffffff' },
        { title: 'Ch. 56 — Ketil’s Farm', sub: '41 pages', right: '', read: false, downloaded: true, weight: '400', bg: '#ffffff' },
        { title: 'Ch. 53 — Servant', sub: 'finished · 5 days ago', right: '', read: true, downloaded: true, weight: '400', bg: '#ffffff' },
        { title: 'Ch. 52 — Snake', sub: 'finished · 6 days ago', right: '', read: true, downloaded: false, weight: '400', bg: '#ffffff' },
        { title: 'Ch. 51 — The Man With No Past', sub: 'finished · 6 days ago', right: '', read: true, downloaded: false, weight: '400', bg: '#ffffff' },
      ],
    };
  }
}
</script>
</body>
</html>
