<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "DejaVu Sans", Verdana, Geneva, sans-serif; }
    a { color: #8a4a2a; } a:hover { color: #5e3018; }
    .gd-rule { background: #555555; }
    .gd-hair { background: #dddddd; }
  </style>
</helmet>

<div style="width: 1264px; height: 1680px; background: #ffffff; color: #000000; display: flex; flex-direction: column; overflow: hidden;">

  <!-- ── title bar (row_h = 102px at this panel size) ────────────── -->
  <div style="height: 102px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 19px; border-bottom: 1px solid #555555; box-sizing: border-box;">
    <div style="font-size: 42px; font-weight: 700; letter-spacing: -0.5px;">Library</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 30px; color: #444444;">42 series</div>
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 13.5 12 17.5V2.5l5.5 4L6.5 17.5"></path></svg>
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path><path d="M10.5 21a1.8 1.8 0 0 0 3 0"></path></svg>
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="42" height="24" viewBox="0 0 42 24" fill="none" stroke="#000000" stroke-width="1.8"><rect x="1" y="4" width="34" height="16" rx="3"></rect><rect x="4" y="7" width="24" height="10" fill="#000000" stroke="none"></rect><path d="M38 9v6" stroke-linecap="round"></path></svg>
      <div style="font-size: 30px; font-variant-numeric: tabular-nums;">84%</div>
    </div>
  </div>

  <!-- ── continue reading ─────────────────────────────────────────── -->
  <div style="padding: 22px 19px 0 19px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 26px; letter-spacing: 2.4px; text-transform: uppercase; color: {{c.label}}; font-weight: 700;">Continue reading</div>

    <div style="display: flex; gap: 22px; align-items: stretch; border: 1px solid #aaaaaa; padding: 20px; box-sizing: border-box;">
      <div style="width: 240px; height: 360px; flex-shrink: 0; background: #6f7d86; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box;">
        <div style="color: #ffffff; font-size: 26px; font-weight: 700; line-height: 1.15; text-wrap: pretty;">Vinland Saga</div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 0;">
        <div style="font-size: 46px; font-weight: 700; line-height: 1.1; text-wrap: pretty;">Vinland Saga</div>
        <div style="height: 10px;"></div>
        <div style="font-size: 32px; color: #333333;">Chapter 54 &mdash; The Battle of the Gods</div>
        <div style="height: 16px;"></div>

        <!-- metadata rail: every value here is real data we already hold or can hold -->
        <div style="display: flex; flex-wrap: wrap; gap: 10px 12px;">
          <div style="border: 1px solid #000000; padding: 6px 14px; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="{{c.star}}" stroke="none"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8Z"></path></svg>
            <span style="font-variant-numeric: tabular-nums;">8.74</span>
          </div>
          <div style="background: {{c.statusTint}}; padding: 7px 16px; font-size: 26px; color: {{c.ink}};">Publishing</div>
          <div style="background: {{c.genreTint}}; padding: 7px 16px; font-size: 26px; color: {{c.ink}};">Action &middot; Drama</div>
        </div>

        <div style="flex-grow: 1;"></div>

        <div style="display: flex; align-items: baseline; gap: 12px;">
          <div style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">54 / 213</div>
          <div style="font-size: 28px; color: #555555;">chapters read</div>
          <div style="flex-grow: 1;"></div>
          <div style="font-size: 28px; color: #555555;">2 days ago</div>
        </div>
        <div style="height: 10px;"></div>
        <div style="height: 8px; background: #cccccc; position: relative;">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 25%; background: {{c.bar}};"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── shelf ────────────────────────────────────────────────────── -->
  <div style="padding: 30px 19px 0 19px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="font-size: 26px; letter-spacing: 2.4px; text-transform: uppercase; color: {{c.label}}; font-weight: 700;">Recent</div>
      <div style="flex-grow: 1; height: 1px; background: #dddddd;"></div>
      <div style="font-size: 26px; color: #555555;">Sort: last read</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
      <sc-for list="{{shelf}}" as="card" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column;">
          <div style="height: 400px; border: 1px solid #aaaaaa; display: flex; align-items: flex-end; box-sizing: border-box; background: {{card.tint}}; padding: 12px;">
            <div style="color: #ffffff; font-size: 24px; font-weight: 700; line-height: 1.15; text-wrap: pretty;">{{card.title}}</div>
          </div>
          <div style="height: 8px; background: #cccccc;">
            <div style="height: 8px; background: {{c.bar}}; width: {{card.pct}};"></div>
          </div>
          <div style="height: 10px;"></div>
          <div style="font-size: 26px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{card.title}}</div>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
            <div style="font-size: 24px; color: #555555; font-variant-numeric: tabular-nums;">{{card.read}}</div>
            <sc-if value="{{card.downloaded}}" hint-placeholder-val="{{true}}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"></path><path d="m7.5 10 4.5 4.5 4.5-4.5"></path><path d="M4 20h16"></path></svg>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ── bottom nav replaces the flat text menu ───────────────────── -->
  <div style="height: 132px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #555555; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-top: 6px solid {{c.accent}}; box-sizing: border-box;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16"></rect><rect x="14" y="4" width="7" height="16"></rect></svg>
      <div style="font-size: 26px; font-weight: 700;">Library</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
      <div style="font-size: 26px; color: #555555;">Search</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h7a3 3 0 0 1 2 1 3 3 0 0 1 2-1h7"></path><path d="M3 5.5v13h7a3 3 0 0 1 2 1 3 3 0 0 1 2-1h7v-13"></path><path d="M12 6.5v13"></path></svg>
      <div style="font-size: 26px; color: #555555;">Browse</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"></path></svg>
      <div style="font-size: 26px; color: #555555;">Settings</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#a85f38","section":"Theme"},"mono":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":1264,"height":1680}}'>
class Component extends DCLogic {
  renderVals() {
    const mono = this.props.mono ?? false;
    const rust = this.props.accent ?? '#a85f38';
    // One muted family: shared lightness/chroma, hue varied. Kaleido desaturates,
    // so these are already pulled back from sRGB — and each has a gray twin below,
    // because color must never be the only carrier of meaning.
    const c = mono
      ? { accent: '#000000', star: '#555555', bar: '#222222', label: '#555555',
          status: '#000000', statusBd: '#aaaaaa', genre: '#999999', genreBd: '#aaaaaa',
          statusTint: '#f0f0f0', genreTint: '#f6f6f6', ink: '#000000',
          heat: ['#eeeeee', '#cccccc', '#999999', '#555555', '#000000'] }
      : { accent: rust, star: '#b08a2e', bar: rust, label: rust,
          status: '#4c7a55', statusBd: '#4c7a55', genre: '#3f6b8c', genreBd: '#3f6b8c',
          statusTint: '#dbe7dd', genreTint: '#dae4eb', ink: '#000000',
          heat: ['#eeeeee', '#dcc9a6', '#c9a86b', '#a85f38', '#6c3f24'] };
    return {
      c,
      shelf: [
        { title: 'Chainsaw Man', tint: '#7a5c52', pct: '78%', read: '76 / 97', downloaded: true },
        { title: 'Frieren', tint: '#5f6f78', pct: '41%', read: '52 / 126', downloaded: true },
        { title: 'Blue Period', tint: '#6b6470', pct: '12%', read: '9 / 74', downloaded: false },
        { title: 'Oyasumi Punpun', tint: '#5a5a5a', pct: '100%', read: '147 / 147', downloaded: true },
        { title: 'Dandadan', tint: '#6d6255', pct: '16%', read: '31 / 188', downloaded: true },
        { title: 'Witch Hat Atelier', tint: '#63707a', pct: '22%', read: '18 / 82', downloaded: false },
      ],
    };
  }
}
</script>
</body>
</html>
