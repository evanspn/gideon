<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "DejaVu Sans", Verdana, Geneva, sans-serif; }
    a { color: #8a4a2a; } a:hover { color: #5e3018; }
  </style>
</helmet>

<div style="width: 1264px; height: 1680px; background: #ffffff; color: #000000; display: flex; flex-direction: column; overflow: hidden;">

  <!-- title bar -->
  <div style="height: 102px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 19px; border-bottom: 1px solid #555555; box-sizing: border-box;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"></path></svg>
    <div style="font-size: 42px; font-weight: 700;">Library</div>
    <div style="flex-grow: 1;"></div>
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16"></rect><rect x="14" y="4" width="7" height="16"></rect></svg>
  </div>

  <!-- filter segments -->
  <div style="height: 88px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 19px; border-bottom: 1px solid #dddddd; box-sizing: border-box;">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <div style="padding: 10px 22px; font-size: 28px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: {{f.weight}};">{{f.label}}</div>
    </sc-for>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 26px; color: #555555;">Sort: last read</div>
  </div>

  <!-- dense rows: cover, title, MAL facts, progress -->
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="height: 194px; flex-shrink: 0; display: flex; gap: 20px; align-items: center; padding: 0 19px; border-bottom: 1px solid #dddddd; box-sizing: border-box;">
        <div style="width: 116px; height: 174px; flex-shrink: 0; background: {{r.tint}};"></div>

        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="font-size: 36px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.title}}</div>
            <sc-if value="{{r.done}}" hint-placeholder-val="{{true}}">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5 11-11"></path></svg>
            </sc-if>
          </div>

          <!-- one metadata line: score · status · genres · downloads -->
          <div style="display: flex; align-items: center; gap: 10px; font-size: 25px; color: #333333;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="{{c.star}}" stroke="none" style="flex-shrink: 0;"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8Z"></path></svg>
            <span style="font-variant-numeric: tabular-nums; font-weight: 700;">{{r.score}}</span>
            <span style="color: #aaaaaa;">|</span>
            <span style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 18px; height: 18px; background: {{r.statusColor}};"></span><span>{{r.status}}</span></span>
            <span style="color: #aaaaaa;">|</span>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.genres}}</span>
          </div>

          <div style="display: flex; align-items: center; gap: 10px; font-size: 25px; color: #555555;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 3v11"></path><path d="m7.5 10 4.5 4.5 4.5-4.5"></path><path d="M4 20h16"></path></svg>
            <span>{{r.downloads}}</span>
            <span style="color: #aaaaaa;">|</span>
            <span>{{r.when}}</span>
          </div>
        </div>

        <div style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
          <div style="font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums;">{{r.read}}</div>
          <div style="width: 250px; height: 8px; background: #cccccc;">
            <div style="height: 8px; background: {{c.bar}}; width: {{r.pct}};"></div>
          </div>
          <div style="font-size: 24px; color: #555555;">{{r.next}}</div>
        </div>

        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><path d="m9.5 5 7 7-7 7"></path></svg>
      </div>
    </sc-for>
  </div>

  <!-- nav -->
  <div style="height: 132px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #555555; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9l8-5 8 5v10"></path><path d="M9 19v-6h6v6"></path></svg>
      <div style="font-size: 26px; color: #555555;">Today</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-top: 6px solid {{c.accent}}; box-sizing: border-box;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16"></rect><rect x="14" y="4" width="7" height="16"></rect></svg>
      <div style="font-size: 26px; font-weight: 700;">Library</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
      <div style="font-size: 26px; color: #555555;">Discover</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"></path></svg>
      <div style="font-size: 26px; color: #555555;">Settings</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"scheme":{"editor":"enum","default":"ink-rust","options":["ink-rust","indigo","sumi","botanical","mono"],"section":"Theme"},"$preview":{"width":1264,"height":1680}}'>
class Component extends DCLogic {
  renderVals() {
    // Five colour profiles. Kaleido subtracts saturation, so each is already
    // muted in sRGB rather than relying on the panel's CFA gain to mute it.
    // 'mono' is the non-Kaleido build — a real target, not a degraded fallback.
    const SCHEMES = {
      'ink-rust': {
        accent: '#a85f38', star: '#b08a2e', bar: '#a85f38', label: '#a85f38',
        status: '#4c7a55', statusBd: '#4c7a55', genre: '#3f6b8c', genreBd: '#3f6b8c',
        statusTint: '#dbe7dd', genreTint: '#dae4eb', ink: '#000000',
        heat: ['#eeeeee', '#dcc9a6', '#c9a86b', '#a85f38', '#6c3f24'] },
      'indigo': {
        accent: '#3f5488', star: '#a2603f', bar: '#3f5488', label: '#3f5488',
        status: '#3a6e72', statusBd: '#3a6e72', genre: '#6b4a73', genreBd: '#6b4a73',
        statusTint: '#d7e4e4', genreTint: '#e4dcea', ink: '#000000',
        heat: ['#eeeeee', '#c8cfe2', '#8e9cc4', '#3f5488', '#28345a'] },
      'sumi': {
        accent: '#b14a32', star: '#b14a32', bar: '#1a1a1a', label: '#1a1a1a',
        status: '#1a1a1a', statusBd: '#6e6a63', genre: '#6e6a63', genreBd: '#6e6a63',
        statusTint: '#eedcd5', genreTint: '#eeece7', ink: '#000000',
        heat: ['#efece6', '#e0c4ba', '#cd8874', '#b14a32', '#6f2d1e'] },
      'botanical': {
        accent: '#a4633e', star: '#9a7a34', bar: '#5f6f3f', label: '#5f6f3f',
        status: '#5f6f3f', statusBd: '#5f6f3f', genre: '#4e6e86', genreBd: '#4e6e86',
        statusTint: '#e2e6d6', genreTint: '#dfe6ec', ink: '#000000',
        heat: ['#eeeeee', '#d5dcc2', '#a8b585', '#5f6f3f', '#3b4527'] },
      'mono': {
        accent: '#000000', star: '#555555', bar: '#222222', label: '#555555',
        status: '#000000', statusBd: '#aaaaaa', genre: '#999999', genreBd: '#aaaaaa',
        statusTint: '#f0f0f0', genreTint: '#f6f6f6', ink: '#000000',
        heat: ['#eeeeee', '#cccccc', '#999999', '#555555', '#000000'] },
    };
    const c = SCHEMES[this.props.scheme] ?? SCHEMES['ink-rust'];
    const on  = { label: '', border: c.accent, bg: c.accent, fg: '#ffffff', weight: '700' };
    const off = { label: '', border: '#aaaaaa', bg: '#ffffff', fg: '#333333', weight: '400' };
    const seg = (label, active) => ({ ...(active ? on : off), label });
    return {
      c,
      filters: [seg('All 42', true), seg('Reading 11', false), seg('Unread 6', false), seg('Downloaded 18', false)],
      rows: [
        { title: 'Vinland Saga',  score: '8.74', status: 'Publishing', statusColor: c.status, genres: 'Action · Drama · Historical', downloads: '18 chapters · 214 MB', when: '2 days ago',  read: '54 / 213', pct: '25%', next: 'next: Ch. 55', tint: '#6f7d86', done: false },
        { title: 'Chainsaw Man',  score: '8.61', status: 'Publishing', statusColor: c.status, genres: 'Action · Supernatural',       downloads: '9 chapters · 96 MB',   when: '4 days ago',  read: '76 / 97',  pct: '78%', next: 'next: Ch. 77', tint: '#7a5c52', done: false },
        { title: 'Frieren',       score: '9.02', status: 'Publishing', statusColor: c.status, genres: 'Adventure · Fantasy',         downloads: '12 chapters · 141 MB', when: '6 days ago',  read: '52 / 126', pct: '41%', next: 'next: Ch. 53', tint: '#5f6f78', done: false },
        { title: 'Blue Period',   score: '8.33', status: 'Publishing', statusColor: c.status, genres: 'Drama · Slice of Life',       downloads: 'not downloaded',       when: '2 weeks ago', read: '9 / 74',   pct: '12%', next: 'next: Ch. 10', tint: '#6b6470', done: false },
        { title: 'Oyasumi Punpun',score: '9.01', status: 'Finished', statusColor: c.genre,   genres: 'Drama · Psychological',       downloads: '3 chapters · 34 MB',   when: '1 month ago', read: '147 / 147',pct: '100%',next: 'finished',     tint: '#5a5a5a', done: true  },
        { title: 'Dandadan',      score: '8.55', status: 'Publishing', statusColor: c.status, genres: 'Action · Comedy · Sci-Fi',    downloads: '5 chapters · 61 MB',   when: '1 month ago', read: '31 / 188', pct: '16%', next: 'next: Ch. 32', tint: '#6d6255', done: false },
        { title: 'Witch Hat Atelier', score: '8.79', status: 'Publishing', statusColor: c.status, genres: 'Adventure · Fantasy',     downloads: 'not downloaded',       when: '2 months ago',read: '18 / 82',  pct: '22%', next: 'next: Ch. 19', tint: '#63707a', done: false },
      ],
    };
  }
}
</script>
</body>
</html>
